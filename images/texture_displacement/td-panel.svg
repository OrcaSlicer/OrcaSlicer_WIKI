<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 516" width="940" height="516" role="img" aria-labelledby="t d" class="fig">
  <title id="t">The texture displacement panel</title>
  <desc id="d">A schematic of the gizmo panel: mode switch, paint tools, view row, the layer stack and the bake footer.</desc>

  <style>
    .fig { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    text { fill: #1f2328; }
    .ttl  { font-size: 15px; font-weight: 600; }
    .lbl  { font-size: 13px; }
    .dim  { font-size: 12.5px; fill: #59636e; }
    .mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .line { stroke: #d0d7de; }
    .surf { stroke: #57606a; fill: none; }
    .surf-fill { fill: #57606a; fill-opacity: .10; }
    .acc  { stroke: #009688; }
    .acc-f{ fill: #009688; }
    .acc-soft { fill: #009688; fill-opacity: .14; }
    .arrow { fill: #8c959f; }
    .ghost { stroke: #8c959f; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .dim, .mono { fill: #9198a1; }
      .card { fill: #1b1f24; stroke: #3d444d; }
      .line { stroke: #3d444d; }
      .surf { stroke: #b1bac4; }
      .surf-fill { fill: #b1bac4; fill-opacity: .12; }
      .acc  { stroke: #1ec8b6; }
      .acc-f{ fill: #1ec8b6; }
      .acc-soft { fill: #1ec8b6; fill-opacity: .18; }
      .arrow { fill: #7d8590; }
      .ghost { stroke: #6e7681; }
    }
  </style>

  <style>
    .pn  { fill: #ffffff; stroke: #d0d7de; }
    .row { fill: #f6f8fa; stroke: #d8dee4; }
    .btn { fill: #ffffff; stroke: #d0d7de; }
    .on  { fill: #009688; fill-opacity: .16; stroke: #009688; }
    .trk { stroke: #d0d7de; stroke-linecap: round; }
    .knb { fill: #009688; }
    .num { fill: #009688; }
    .numtxt { fill: #ffffff; font-size: 10.5px; font-weight: 700; }
    .ph  { font-size: 11px; fill: #59636e; }
    .phb { font-size: 11px; font-weight: 600; fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      .pn  { fill: #15191e; stroke: #3d444d; }
      .row { fill: #1b1f24; stroke: #30363d; }
      .btn { fill: #21262d; stroke: #3d444d; }
      .on  { fill: #1ec8b6; fill-opacity: .20; stroke: #1ec8b6; }
      .trk { stroke: #3d444d; }
      .knb { fill: #1ec8b6; }
      .num { fill: #1ec8b6; }
      .numtxt { fill: #0d1117; }
      .ph  { fill: #9198a1; }
      .phb { fill: #e6edf3; }
    }
  </style>
