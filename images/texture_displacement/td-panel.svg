<text class="numtxt fig" x="389" y="339.6" text-anchor="middle">5</text>
<text class="fig" x="406" y="340" style="font-size:13px"><tspan style="font-weight:600">Resolution &amp; Budget</tspan><tspan class="dim" xml:space="preserve"> — how fine the mesh is made, and how many triangles that may cost.</tspan></text>
<circle class="num" cx="389" cy="398" r="9"/>
<text class="numtxt fig" x="389" y="401.6" text-anchor="middle">6</text>
<text class="fig" x="406" y="402" style="font-size:13px"><tspan style="font-weight:600">Bake</tspan><tspan class="dim" xml:space="preserve"> — turns the preview into real geometry. Undo puts it back.</tspan></text>
