<text class="numtxt fig" x="389" y="277.6" text-anchor="middle">4</text>
<text class="fig" x="406" y="278" style="font-size:13px"><tspan style="font-weight:600">Layer</tspan><tspan class="dim" xml:space="preserve"> — image, paint and settings. Up to 8 stack like image-editor layers.</tspan></text>
