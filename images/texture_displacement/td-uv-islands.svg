<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t d" class="fig">
  <title id="t">From painted surface to UV islands</title>
  <desc id="d">Seams cut the painted area, the unwrap flattens each piece, and Connect islands decides whether the pieces are laid out as a net or packed separately.</desc>

  <style>
    .fig { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    text { fill: #1f2328; }
    .ttl  { font-size: 15px; font-weight: 600; }
    .lbl  { font-size: 13px; }
    .dim  { font-size: 12.5px; fill: #59636e; }
    .mono { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #59636e; }
    .card { fill: #f6f8fa; stroke: #d0d7de; }
    .line { stroke: #d0d7de; }
    .surf { stroke: #57606a; fill: none; }
    .surf-fill { fill: #57606a; fill-opacity: .10; }
    .acc  { stroke: #009688; }
    .acc-f{ fill: #009688; }
    .acc-soft { fill: #009688; fill-opacity: .14; }
    .arrow { fill: #8c959f; }
    .ghost { stroke: #8c959f; stroke-dasharray: 3 3; fill: none; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .dim, .mono { fill: #9198a1; }
      .card { fill: #1b1f24; stroke: #3d444d; }
      .line { stroke: #3d444d; }
      .surf { stroke: #b1bac4; }
      .surf-fill { fill: #b1bac4; fill-opacity: .12; }
      .acc  { stroke: #1ec8b6; }
      .acc-f{ fill: #1ec8b6; }
      .acc-soft { fill: #1ec8b6; fill-opacity: .18; }
      .arrow { fill: #7d8590; }
      .ghost { stroke: #6e7681; }
    }
  </style>

  <style>
    .seam { stroke: #d1242f; stroke-width: 2.6; stroke-linecap: round; }
    .face { fill: #57606a; fill-opacity: .10; stroke: #57606a; stroke-width: 1.6; }
    .ftop { fill: #57606a; fill-opacity: .07; stroke: #57606a; stroke-width: 1.6; }
    .flt  { fill: #57606a; fill-opacity: .20; stroke: #57606a; stroke-width: 1.6; }
    .frt  { fill: #57606a; fill-opacity: .13; stroke: #57606a; stroke-width: 1.6; }
    .isl  { fill: #009688; fill-opacity: .12; stroke: #009688; stroke-width: 1.6; }
    .grd  { stroke: #8c959f; stroke-width: .7; stroke-opacity: .65; }
    @media (prefers-color-scheme: dark) {
      .seam { stroke: #ff7b72; }
      .face, .ftop, .flt, .frt { stroke: #b1bac4; fill: #b1bac4; }
      .ftop { fill-opacity: .08; } .flt { fill-opacity: .22; } .frt { fill-opacity: .15; }
      .isl  { fill: #1ec8b6; fill-opacity: .16; stroke: #1ec8b6; }
      .grd  { stroke: #6e7681; }
    }
  </style>
